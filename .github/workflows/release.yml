name: Draft release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Check tag
        run: node --input-type=module -e "import fs from 'node:fs'; if(process.env.GITHUB_REF_NAME !== 'v'+JSON.parse(fs.readFileSync('package.json')).version) process.exit(1)"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes
