<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台适配设置</title><link rel="stylesheet" href="style.css"><style>main{max-width:960px;margin:auto;display:block}textarea{box-sizing:border-box;width:100%;min-height:320px;font-family:monospace}p{line-height:1.7}.toolbar{margin:16px 0}</style></head><body><main><section class="panel"><h1>平台适配设置</h1><p>默认配置可直接用于首次接入。网站改版时，可在此修改网页控件选择器。保存的改动从下一次新行动生效，已经发出的消息保持原配置。</p><div class="toolbar"><label>平台 <select id="provider"></select></label><button id="defaults">加载默认配置</button></div><textarea id="config" aria-label="平台适配JSON" spellcheck="false"></textarea><div class="toolbar"><button id="save" class="primary">保存</button><button id="reset">恢复默认</button><button id="exportAdapters">导出适配配置</button><label class="file-button">导入适配配置<input id="importAdapters" type="file" accept="application/json"></label></div><p id="status" role="status" aria-live="polite">就绪</p><p>此页仅导出控件配置，不包含聊天网址、身份或对局记录。完整游戏存档应在观战台导出并自行保管。</p></section></main><script type="module" src="options.js"></script></body></html>
